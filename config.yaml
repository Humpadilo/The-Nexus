name: The Archivist
version: "0.3.0"
slug: the_archivist
description: Read-only local snapshots and audits of a Home Assistant instance.
url: https://github.com/Humpadilo/The-Nexus
arch:
  - amd64
  - aarch64
homeassistant_api: true
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:archive-search
map:
  - type: data
    read_only: false
options:
  schedule_enabled: true
  schedule_interval_hours: 24
  finding_retention_days: 365
schema:
  schedule_enabled: bool
  schedule_interval_hours: int(1,168)
  finding_retention_days: int(30,3650)
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Internal web service (Ingress recommended)
