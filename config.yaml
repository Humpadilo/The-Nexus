name: The Archivist
version: "0.8.4"
slug: the_archivist
description: Read-only local snapshots and audits of a Home Assistant instance.
url: https://github.com/Humpadilo/The-Nexus
arch:
  - amd64
  - aarch64
homeassistant_api: true
hassio_api: true
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:archive-search
map:
  - type: data
    read_only: false
options:
  schedule_enabled: true
  schedule_interval_hours: 24
  finding_retention_days: 365
  curator_trigger_token: ""
  behavior_history_days: 30
  behavior_history_max_events: 20000
  behavior_history_max_entities: 150
  behavior_history_chunk_hours: 24
schema:
  schedule_enabled: bool
  schedule_interval_hours: int(1,168)
  finding_retention_days: int(30,3650)
  curator_trigger_token: str
  behavior_history_days: int(1,90)
  behavior_history_max_events: int(100,100000)
  behavior_history_max_entities: int(1,500)
  behavior_history_chunk_hours: int(1,24)
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Internal web service (Ingress recommended)
